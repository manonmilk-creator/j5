<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Feed</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}

body{
  background:#000;
  overflow-y:scroll;
  scroll-snap-type:y mandatory;
}

/* POSTS */
.post{
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  scroll-snap-align:start;
}

.card{
  width:100%;
  max-width:430px;
  height:92vh;
  border-radius:25px;
  overflow:hidden;
  position:relative;
  background:#111;
}

.card img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
  cursor:pointer;
}

/* MODAL */
.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.95);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:999;
}

.modal img{
  width:100%;
  height:100%;
  object-fit:contain;
}

.close{
  position:absolute;
  top:20px;
  right:20px;
  color:white;
  font-size:20px;
}
</style>
</head>

<body>

<!-- MODAL -->
<div class="modal" id="modal" onclick="closeModal()">

<script>

/* IMAGE FULLSCREEN */
const modal = document.getElementById("modal");
const modalImg = document.getElementById("modalImg");

document.querySelectorAll(".card img").forEach(img=>{
  img.addEventListener("click", ()=>{
    modal.style.display="flex";
    modalImg.src = img.src;
  });
});

function closeModal(){
  modal.style.display="none";
  modalImg.src="";
}

</script>
